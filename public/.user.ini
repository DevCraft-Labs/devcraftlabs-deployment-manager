; Raises PHP's upload ceiling to comfortably fit the File Clipboard feature's
; 10MB limit (default upload_max_filesize/post_max_size are too small).
; cPanel's EA-PHP handler (see .htaccess) reads .user.ini files from the
; document root automatically; no Apache/WHM-level change is required.
upload_max_filesize = 16M
post_max_size = 20M
